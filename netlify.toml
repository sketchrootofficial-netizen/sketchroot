# SketchRoot: Netlify configuration. Headers live in the _headers file.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send the bare index address to the clean root, so there is one canonical home page.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The video toolkit lives in this repo but is not part of the website.
[[redirects]]
  from = "/video-toolkit/*"
  to = "/404.html"
  status = 404
  force = true

# Friendly aliases people may type or link to.
[[redirects]]
  from = "/neet-mds-previous-year-questions"
  to = "/neet-mds/previous-year-questions/"
  status = 301
[[redirects]]
  from = "/neetmds"
  to = "/neet-mds/"
  status = 301
[[redirects]]
  from = "/inicet"
  to = "/ini-cet/"
  status = 301
[[redirects]]
  from = "/redbook"
  to = "/red-book/"
  status = 301
[[redirects]]
  from = "/method-of-loci"
  to = "/memory-palace/"
  status = 301
[[redirects]]
  from = "/memory-palace-for-dental-students"
  to = "/memory-palace/"
  status = 301
[[redirects]]
  from = "/about"
  to = "/founder/"
  status = 301

# One canonical host. Netlify also does this once the primary domain is set.
[[redirects]]
  from = "https://www.sketchroot.com/*"
  to = "https://sketchroot.com/:splat"
  status = 301
  force = true
