<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Karla;src:url(karla-latin.woff2) format("woff2");font-weight:200 800}
@font-face{font-family:Caveat;src:url(caveat-full.woff2) format("woff2")}
:root{--ink:#1e1e1e;--amber:#F6B31E;--paper:#FCFBF7;--cut:#d9480f;--muted:#6F6A64;--hair:#E6E0D4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0e0c0b;font-family:Karla,sans-serif;color:var(--ink)}
.layer{position:absolute;inset:0;opacity:0;overflow:hidden}
.paper{background:var(--paper)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#e7e0d0 2px,transparent 2px);background-size:40px 40px;opacity:.65}
.hand{font-family:Caveat,cursive;font-weight:700}
.abs{position:absolute}
.kick{font-size:30px;font-weight:800;letter-spacing:5px;color:#b07d0a}
.h1{font-size:76px;font-weight:800;letter-spacing:-2px;line-height:1.02}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--amber)}
.bul{font-size:38px;font-weight:700;line-height:1.25;display:flex;gap:18px;align-items:flex-start;margin:10px 0;opacity:0}
.bul i{font-style:normal;flex:none;width:38px;height:38px;border-radius:50%;background:var(--amber);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:3px}
.box{position:absolute;opacity:0;text-align:center;display:flex;align-items:center;justify-content:center;font-weight:800}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#tl{position:absolute;left:90px;right:90px;top:42px;height:70px;opacity:0}
.yr{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-weight:800;font-size:24px;color:#b5ad9f}
.yr b{display:block;width:22px;height:22px;border-radius:50%;background:#ddd5c5;margin:0 auto 6px}
.yr.on{color:var(--ink)} .yr.on b{background:var(--amber);box-shadow:0 0 0 6px rgba(246,179,30,.3)}
.tbl{border-collapse:collapse;font-size:36px}
.tbl td,.tbl th{border-bottom:3px solid var(--hair);padding:20px 30px;text-align:left}
.tbl th{font-size:40px}
</style></head><body>

</div>

const NS='http://www.w3.org/2000/svg';const inkEls=[];
INK.forEach(d=>{const e=document.createElementNS(NS,'path');e.setAttribute('d',d);e.setAttribute('fill','none');e.setAttribute('stroke','#2a2422');e.setAttribute('stroke-width','1.3');$('ink').appendChild(e);inkEls.push([e,0])});
inkEls.forEach(o=>{o[1]=o[0].getTotalLength();o[0].style.strokeDasharray=o[1]});

function rp(d,o){const g=RS.path(d,Object.assign({roughness:1.1,bowing:.8,stroke:'#1e1e1e',strokeWidth:2.6,seed:7},o));return g}
const MAND="M100,88 C92,66 120,52 146,58 C164,62 170,78 160,96 Q182,124 215,140 Q262,118 300,60 C314,110 318,190 338,250 C350,280 362,294 384,298 L726,298 C756,302 772,332 768,372 C766,402 752,428 720,432 C640,440 520,428 420,430 C330,432 280,420 240,428 C200,436 172,420 166,398 C150,330 128,220 116,150 C112,128 104,108 100,88 Z";

const TEETH=[tooth(400,54,44),tooth(458,54,48),tooth(516,54,50),tooth(574,40,52),tooth(618,40,54),`M662,298 L662,252 L679,234 L696,252 L696,298`,tooth(700,26,58),tooth(728,26,58)];
const CUTS={

function addLen(g){return [...g.querySelectorAll('path')].map(e=>{const L=e.getTotalLength();e.style.strokeDasharray=L;e.style.strokeDashoffset=L;return[e,L]})}
function txt(x,y,s,size=30,col='#1e1e1e',anchor='start'){const e=document.createElementNS(NS,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('font-size',size);e.setAttribute('fill',col);e.setAttribute('text-anchor',anchor);e.textContent=s;$('dia').appendChild(e);return e}
function buildDia(key,opts={}){
  if(diaKey===key)return;diaKey=key;const svg=$('dia');svg.innerHTML='';svg.setAttribute('viewBox',opts.vb||'40 10 800 470');
  diaEls={base:[],cuts:[],labs:[],extra:[]};
  const base=[rp(MAND,{seed:3,strokeWidth:3}),...TEETH.map((d,i)=>rp(d,{seed:20+i,strokeWidth:2.2,roughness:.8}))];
  const fo=RS.ellipse(230,228,16,24,{seed:5,stroke:'#1e1e1e',strokeWidth:2,strokeLineDash:[6,6],roughness:.8});
  const can=rp('M230,240 C310,300 450,345 560,352',{seed:9,strokeWidth:2,strokeLineDash:[8,8],stroke:'#6f6a64'});
  const mf=RS.ellipse(568,352,14,10,{seed:11,strokeWidth:2,roughness:.6});
  [...base,fo,can,mf].forEach(g=>{svg.appendChild(g);diaEls.base.push(...addLen(g))});
  if(opts.labels){opts.labels.forEach(l=>diaEls.labs.push(txt(...l)))}
  if(opts.extra){opts.extra.forEach(d=>{const g=rp(d[0],d[1]);svg.appendChild(g);diaEls.extra.push(...addLen(g))})}
  (CUTS[opts.cut||key]||[]).forEach(([d,ty],i)=>{const g=rp(d,{seed:40+i,stroke:'#d9480f',strokeWidth:5,roughness:.7,strokeLineDash:ty==='d'?[14,12]:undefined});svg.appendChild(g);diaEls.cuts.push(...addLen(g).map(o=>(o.push(ty),o)))});
  (CUTLAB[opts.cut||key]||[]).forEach(l=>{const e=txt(l[0],l[1],l[2],34,'#d9480f');e.style.opacity=0;diaEls.labs.push(e);e.dataset.cut=1});
}
function drawDia(t,a,cutA,labA){
  diaEls.base.forEach(([e,L],i)=>{const k=eo(p(t,a+i*.04,a+.9+i*.04));e.style.strokeDashoffset=L*(1-k)});
  diaEls.extra.forEach(([e,L],i)=>{const k=eo(p(t,cutA-.3+i*.05,cutA+.5+i*.05));e.style.strokeDashoffset=L*(1-k)});
  diaEls.cuts.forEach(([e,L,ty],i)=>{const k=io(p(t,cutA+i*.55,cutA+.75+i*.55));
    if(ty==='d'){e.style.strokeDasharray='';e.style.strokeDashoffset='';e.style.opacity=k}else{e.style.strokeDashoffset=L*(1-k)}});
  diaEls.labs.forEach((e,i)=>{if(e.dataset.cut){const k=p(t,labA+i*.25,labA+.4+i*.25);e.style.opacity=k}else e.style.opacity=p(t,a+.6+i*.12,a+1+i*.12)});
}
// ---------- paper widgets ----------
const YEARS=['1849','1907','1942','1957','1961','1968','1977'];
$('tl').innerHTML='<div style="position:absolute;left:0;right:0;top:10px;height:4px;background:#ddd5c5;border-radius:2px"></div>'+YEARS.map((y,i)=>`<div class="yr" id="yr${i}" style="left:${i/(YEARS.length-1)*100}%"><b></b>${y}</div>`).join('');
function setTL(idx,o){$('tl').style.opacity=o;YEARS.forEach((y,i)=>$('yr'+i).className='yr'+(i===idx?' on':''))}
function pop(el,t,a,d=.35,dy=30){const k=p(t,a,a+d);el.style.opacity=k;el.style.transform=`translateY(${(1-eo(k))*dy}px) scale(${k<1?.85+.15*back(k):1})`}
function setBul(list){$('buls').innerHTML=list.map((b,i)=>`<div class="bul"><i>${i+1}</i><span>${b}</span></div>`).join('')}
function stickerIn(name,box,t,a){const im=$('pst');if(!im.src.endsWith('st_'+name+'.png'))im.src='st_'+name+'.png';Object.assign(im.style,{left:box[0]+'px',top:box[1]+'px',width:box[2]+'px',height:box[3]+'px'});
  const k=p(t,a,a+.45);im.style.opacity=k>0?1:0;im.style.transform=`scale(${k<1?.3+.7*back(k):1+.012*Math.sin(t*2.2)}) rotate(${k<1?-10*(1-k):Math.sin(t*1.6)*1.2}deg)`}
// ---------- scene script ----------
const OST=[
 {key:'hullihen',st:'hulligan',yr:0,t:'Hullihen · 1849*',kick:'STALL 1 · THE FIRST CUT',
  dec:['“HULLIGAN”','→ <b>Hullihen</b>','rope round the neck = burn-scar contracture he released'],
  b:['First mandibular osteotomy on record','Set back a protruded anterior alveolar segment','*Sources cite 1846–1849']},
 {key:'blair',st:'blair',yr:1,t:'Blair · 1907',kick:'STALL 2 · THE STRAIGHT CUT',
  dec:['“BLAIR THE LIAR”','→ <b>Blair</b>','one plank cut STRAIGHT across = horizontal cut'],
  b:['Horizontal ramus osteotomy, external approach','Small bone contact → high relapse','Muscle pull + nerve at risk; now historical']},
 {key:'schuchardt',st:'cat',yr:2,t:'Schuchardt · 1942',kick:'STALL 3 · THE STEP',
  dec:['cat in a BOOT holding a CHART','→ <b>Shoe-chart = Schuchardt</b>','she climbs a STEP = step osteotomy'],
  b:['First intraoral approach to the ramus','Added a STEP: medial & lateral cuts at different levels','More bone contact than a straight cut']},
 {key:'obwegeser',st:'hugo',yr:3,t:'Trauner & Obwegeser · 1957',kick:'STALL 4 · THE SPLIT',focus:{x:640,y:120,w:430,h:500},
  dec:['HUGO + TRAUMA carry a GEYSER','→ <b>Hugo Obwegeser & Richard Trauner</b>','split down the middle = SAGITTAL split'],
  b:['Ramus split sagittally: broad bone-to-bone contact','Advance OR set back, through the mouth, no scar','Obwegeser first described it 1953–55; paper 1957']},
 {key:'dalpont',st:'dal',yr:4,t:'Dal Pont · 1961',kick:'STALL 5 · THE BEND',
  dec:['“DAL” + a pipe that bends DOWN','→ <b>Dal Pont</b>','the bend = vertical buccal cut'],
  b:['Lateral cut → vertical buccal cut, 1st–2nd molar','Larger contact surface → bigger advancements','Less muscle detachment']},
 {key:'hunsuck',st:'hen',yr:5,t:'Hunsuck · 1968*',kick:'STALL 6 · THE SHORT STRAW',
  dec:['a HEN SUCKS a SHORT straw','→ <b>Hunsuck</b>','short straw = SHORT medial cut'],
  b:['Medial cut ends just behind the lingula','Less soft-tissue dissection','*Some sources: 1967']},
 {key:'epker',st:'abkari',yr:6,t:'Epker · 1977',kick:'STALL 7 · THE CAREFUL KNIFE',cuts:'hunsuck',
  dec:['“ABKARI” slices oh-so-carefully','→ <b>Epker</b>','careful knife = minimal stripping'],
  b:['Biological refinements of the split','Minimal stripping of masseter & medial pterygoid','Kinder to muscles & the TMJ → smoother recovery'],
  extra:[["M160,250 C210,236 300,246 334,262 C344,330 334,392 300,418 C250,426 200,420 175,392 C160,340 156,290 160,250 Z",{seed:61,stroke:'#2f7de1',strokeWidth:2,fill:'rgba(47,125,225,.12)',fillStyle:'hachure',hachureGap:10}]],
  xl:[[180,470,'masseter left attached',32,'#2f7de1']]},
];
const S=[];let T=0;const add=(name,dur,o={})=>{S.push(Object.assign({name,a:T,b:T+dur},o));T+=dur};
add('intro',10);add('what',7.5);add('phases',7);add('toolkit',8);add('shop',6.5);add('anat',10);
OST.forEach(o=>add('ost',15.5,{o}));
add('modern',14);add('ivro',12);add('invl',10.5);add('compare',10);add('quiz',17);add('end',6);
window.DURATION=T;
// ---------- free-layout scenes (paper) ----------
function freeHTML(name){
 const F=$('free');if(F.dataset.n===name)return;F.dataset.n=name;
 const H={
 what:`<div class="abs kick" style="left:0;right:0;top:140px;text-align:center">BEFORE WE ENTER THE SHOP</div>

// ---------- render ----------
async function render(t){
 const sc=S.find(s=>t>=s.a&&t<s.b)||S[S.length-1];const lt=t-sc.a,D=sc.b-sc.a;
 const sketchScenes={intro:1,shop:1,quiz:1};
 let skOn=!!sketchScenes[sc.name]||(sc.name==='ost'&&lt<1.7);
 $('L_sketch').style.opacity=skOn?1:0;$('L_paper').style.opacity=skOn?0:1;
 let fl=0;
 // reset per-frame defaults
 $('focus').style.opacity=0;$('liftst').style.opacity=0;$('skcap').style.opacity=0;$('title').style.opacity=0;$('ink').style.opacity=0;$('sk').style.opacity=1;
 if(skOn){
  if(sc.name==='intro'){
   setCam(camFor(null));$('skpaper').style.opacity=1-p(lt,7.6,8.4);
   $('ink').style.opacity=1-p(lt,7.2,8.2);$('sk').style.opacity=p(lt,6.4,8.0);
   const N=inkEls.length;inkEls.forEach(([e,L],i)=>{const s=.3+5.6*i/N;const k=p(lt,s,s+.7);e.style.strokeDashoffset=L*(1-k)});
   $('sk').style.filter=`saturate(${p(lt,6.4,8.4)})`;
   pop($('title'),lt,7.6,.5,40);
  }else{$('sk').style.filter='';$('skpaper').style.opacity=0}
